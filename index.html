const MIN = 60000;
function timeAgo(ts){
  const d = Date.now()-ts;
  if(d < MIN) return 'baru saja';
  if(d < 60*MIN) return Math.floor(d/MIN)+' mnt';
  if(d < 24*60*MIN) return Math.floor(d/(60*MIN))+' jam';
  const dt = new Date(ts), today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate()-1);
  if(dt.toDateString()===yesterday.toDateString()) return 'kemarin';
  return dt.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}

/* ================= STORE (mini-Zustand + localStorage, Supabase-ready) ================= */
// Skema 1:1 siap migrasi ke Supabase: conversations, messages, customers, quick_replies, team_members
const DB_KEY = 'balascepat_v1';
function persist(db){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw){ const db = JSON.parse(raw); if(db && db.conversations) return db; } }catch(e){}
  const db = seedDB(); persist(db); return db;
}
const _subs = new Set();
const store = {
  db: loadDB(),
  update(fn){ this.db = fn(this.db); persist(this.db); _subs.forEach(f=>f()); },
};
function useStore(sel){
  const [,force] = useReducer(x=>x+1, 0);
  useEffect(()=>{ _subs.add(force); return ()=>_subs.delete(force); },[]);
  return sel ? sel(store.db) : store.db;
}

function generateAIResponse(conv, customer, messages){
  const last5 = messages.slice(-5);
  const text = last5.map(m=>String(m.text||'').toLowerCase()).join(' ');
  const firstName = String(customer.name||'kak').replace('@','').split(/[\s._]+/)[0];
  const name = firstName ? firstName[0].toUpperCase()+firstName.slice(1) : 'kak';
  const product = customer.lastOrder && customer.lastOrder!=='-' ? customer.lastOrder : 'produk kami';

  let intent = 'general';
  if(/(cacat|rusak|komplain|kecewa|salah kirim|jelek)/.test(text)) intent='complaint';
  else if(/(ready|stok|stock|tersedia|masih ada|kosong|habis)/.test(text)) intent='stock';
  else if(/(harga|price|pricelist|berapa|mahar|spill|diskon|nego|kurang)/.test(text)) intent='price';
  else if(/(kirim|dikirim|resi|ekspedisi|pengiriman|sampai|kapan|paket|cod)/.test(text)) intent='shipping';
  else if(/(ukuran|size|sizing|muat|ld\b|lingkar|kebesaran|kekecilan)/.test(text)) intent='size';
  else if(/(po\b|pre order|berapa lama|produksi)/.test(text)) intent='po';
  else if(/(order|pesan|beli|checkout|mau |ambil|restock|grosir|keep)/.test(text)) intent='order';
  else if(/(ori|original|kw|asli|palsu)/.test(text)) intent='authentic';
  else if(/(halo|hai|pagi|siang|sore|malam|assalamu|kak\b)/.test(text)) intent='greeting';

  const B = {

/* ================= SOUND ================= */
function playNotif(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1174, ctx.currentTime+0.12);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.55);
  }catch(e){}
}

function getConv(db, id){ return db.conversations.find(c=>c.id===id); }
function getCustomer(db, id){ return db.customers.find(c=>c.id===id); }
function convMessages(db, convId){ return db.messages.filter(m=>m.convId===convId).sort((a,b)=>a.at-b.at); }

function sendAdminMessage(convId, text, attachment){
  if(!text.trim() && !attachment) return;
  store.update(db=>{
    const msgs=[...db.messages, {id:uid(), convId, from:'admin', text:text.trim(), at:nowTs(), attachment:attachment||null}];
    const conversations=db.conversations.map(c=> c.id===convId ? {...c, unread:0, status:'replied', lastMessageAt:nowTs()} : c);
    return {...db, messages:msgs, conversations};
  });
}

// FASE 2.1 — chat baru masuk tiap 15 detik (atau dipicu tombol demo)
function simulateIncomingChat(){
  const beforeCount = store.db.messages.length;
  store.update(db=>{
    const isNew = Math.random() < 0.65 || db.conversations.length < 8;
    let conversations=[...db.conversations], messages=[...db.messages], customers=[...db.customers];
    let newConvId=null;
    if(isNew){
      const p = INCOMING_POOL[Math.floor(Math.random()*INCOMING_POOL.length)];
      let cust = customers.find(c=>c.name===p.name);
      if(!cust){
        cust={id:uid(), name:p.name, phone:p.phone, address:'-', totalSpent:0, lastOrder:'-', followers:p.platform==='ig'?'300':null, orders:[], notes:'Chat masuk dari simulasi realtime.'};
        customers=[...customers, cust];
      }
      newConvId=uid();
      conversations=[{id:newConvId, customerId:cust.id, platform:p.platform, unread:1, status:'open', assignedTo:null, lastMessageAt:nowTs(), createdAt:nowTs()}, ...conversations];
      messages=[...messages, {id:uid(), convId:newConvId, from:'customer', text:p.text, at:nowTs()}];
    } else {
      const open = conversations.filter(c=>c.status!=='done');
      if(!open.length) return db;
      const c = open[Math.floor(Math.random()*open.length)];
      newConvId=c.id;
      const t = REPLY_POOL[Math.floor(Math.random()*REPLY_POOL.length)];
      messages=[...messages, {id:uid(), convId:c.id, from:'customer', text:t, at:nowTs()}];
      conversations=conversations.map(x=> x.id===c.id
        ? {...x, unread:x.unread+1, status: x.status==='done'?'open':x.status, lastMessageAt:nowTs()}
        : x);
      conversations.sort((a,b)=>b.lastMessageAt-a.lastMessageAt);
    }
    return {...db, conversations, messages, customers, _flashConv:newConvId};
  });
  const added = store.db.messages.length > beforeCount;
  const fid = added ? store.db._flashConv : null;
  if(added && store.db.sound) playNotif();
  return fid;
}

/* ================= ICON (React-safe lucide renderer) ================= */
function LucideIcon({name, size=18, className='', strokeWidth=2}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!window.lucide || !ref.current) return;
    const pascal = String(name).split('-').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join('');
    const node = window.lucide.icons[pascal];
    ref.current.innerHTML='';
    if(node){
      const svg = window.lucide.createElement(node);
      svg.setAttribute('width', size); svg.setAttribute('height', size);
      svg.setAttribute('stroke-width', strokeWidth);
      svg.setAttribute('class', 'lucide '+className);
      ref.current.appendChild(svg);
    }
  },[name,size,className,strokeWidth]);
  return <span ref={ref} className="inline-flex items-center justify-center shrink-0"/>;
}

  </div>;
}
let toastSeq=0;
function useToasts(){
  const [toasts,setToasts]=useState([]);
  const push = useCallback((text,icon)=>{
    const id=++toastSeq;
    setToasts(ts=>[...ts,{id,text,icon}]);
    setTimeout(()=>setToasts(ts=>ts.filter(t=>t.id!==id)), 2800);
  },[]);
  return {toasts, push};
}

/* ================= KOLOM 1: INBOX LIST ================= */
const FILTERS = [
  {id:'all', label:'Semua'},
  {id:'unread', label:'Belum Dibaca'},
  {id:'wa', label:'WA'},
  {id:'ig', label:'IG'},
  {id:'shopee', label:'Shopee'},
  {id:'needReply', label:'Perlu Balas'},
];
function InboxList({db, activeId, onSelect, filter, setFilter, search, setSearch, onNewDummy, flashId}){
  const convs = useMemo(()=>{
    let list=[...db.conversations];
    if(filter==='unread') list=list.filter(c=>c.unread>0);
    else if(filter==='needReply') list=list.filter(c=>{ const ms=convMessages(db,c.id); const last=ms[ms.length-1]; return last && last.from==='customer' && c.status!=='done'; });
    else if(PLATFORMS[filter]) list=list.filter(c=>c.platform===filter);
    if(search.trim()){
      const q=search.trim().toLowerCase();
      list=list.filter(c=>{ const cust=getCustomer(db,c.customerId); const ms=convMessages(db,c.id);
        return (cust?.name||'').toLowerCase().includes(q) || ms.some(m=>(m.text||'').toLowerCase().includes(q)); });
    }
    return list.sort((a,b)=>b.lastMessageAt-a.lastMessageAt);
  },[db,filter,search]);
  const unreadTotal = db.conversations.reduce((s,c)=>s+c.unread,0);

  return <div className="flex flex-col h-full bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800">
    <div className="p-3 pb-2">
      <div className="flex items-center justify-between mb-2 px-1">
        <h2 className="font-extrabold text-lg flex items-center gap-2">Inbox
          {unreadTotal>0 && <span className="bg-brand-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">{unreadTotal}</span>}
        </h2>
        <button onClick={onNewDummy} title="Buat Chat Dummy Baru (demo)" className="flex items-center gap-1 text-xs font-bold text-brand-600 hover:text-brand-700 bg-brand-50 dark:bg-brand-900/40 hover:bg-brand-100 px-2.5 py-1.5 rounded-full transition">
          <LucideIcon name="zap" size={13}/> Chat Dummy
        </button>
      </div>
      <div className="relative mb-2">
        <LucideIcon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari pelanggan / pesan..."
          className="w-full bg-slate-100 dark:bg-slate-800 rounded-full pl-9 pr-3 py-2 text-sm placeholder:text-slate-400 focus:ring-2 ring-brand-500"/>
      </div>
      <div className="flex gap-1.5 overflow-x-auto pb-1 no-select">
        {FILTERS.map(f=>{
          const active = filter===f.id;
          return <button key={f.id} onClick={()=>setFilter(f.id)}
            className={`whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full transition ${active?'bg-slate-900 dark:bg-white text-white dark:text-slate-900':'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
            {f.label}</button>;
        })}
      </div>
    </div>
    <div className="flex-1 overflow-y-auto px-2 pb-3">
      {convs.length===0 && <div className="text-center py-12 text-slate-400">
        <LucideIcon name="inbox" size={40} className="mx-auto mb-3 opacity-50"/>
        <p className="text-sm font-medium">Tidak ada percakapan</p>
        <button onClick={onNewDummy} className="mt-3 text-xs font-bold text-brand-600 hover:underline">+ Buat chat dummy untuk demo</button>
      </div>}
      {convs.map(c=>{
        const cust=getCustomer(db,c.customerId)||{name:'?'};
        const ms=convMessages(db,c.id);
        const last=ms[ms.length-1];
        const p=PLATFORMS[c.platform];
        const active=c.id===activeId;
        const member=db.team_members.find(t=>t.id===c.assignedTo);
        return <button key={c.id} onClick={()=>onSelect(c.id)}
          className={`w-full text-left flex gap-3 p-3 rounded-2xl mb-1 transition relative ${active?'bg-brand-50 dark:bg-brand-900/30':'hover:bg-slate-50 dark:hover:bg-slate-800/60'} ${flashId===c.id?'anim-new-chat':''}`}>
          <div className="relative shrink-0">
            <Avatar name={cust.name} id={cust.id}/>
            <span className="absolute -bottom-0.5 -right-0.5"><PlatformDot platform={c.platform} size={20}/></span>
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center justify-between gap-2">
              <span className="font-bold text-sm truncate">{esc(cust.name)}</span>
              <span className="text-[11px] text-slate-400 shrink-0">{timeAgo(c.lastMessageAt)}</span>
            </div>
            <div className="flex items-center justify-between gap-2 mt-0.5">
              <p className={`text-[13px] truncate ${c.unread>0?'font-semibold text-slate-700 dark:text-slate-200':'text-slate-400'}`}>
                {last?.from==='admin'?'✓✓ ':''}{esc(last?.text||'')}
              </p>
              {c.unread>0 && <span className="bg-brand-600 text-white text-[11px] font-bold min-w-[20px] h-5 px-1 rounded-full flex items-center justify-center shrink-0">{c.unread}</span>}
            </div>
            <div className="flex items-center gap-1.5 mt-1">
              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${p.chipBg}`}>{p.short}</span>
              {c.status==='done' && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-500">Selesai</span>}
              {member && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-violet-100 dark:bg-violet-950 text-violet-700 dark:text-violet-300 flex items-center gap-0.5"><LucideIcon name="user" size={10}/>{member.name}</span>}
            </div>
          </div>
        </button>;
      })}
    </div>
  </div>;
}

/* ================= KOLOM 2: JENDELA CHAT ================= */
const EMOJIS = ['😀','😁','😂','🤣','😊','😍','😘','😎','🤔','😅','😭','😡','👍','👎','🙏','👋','👌','✌️','🤝','👏','❤️','🧡','💛','💚','💙','💜','🔥','✨','🎉','🎁','💯','✅','❌','⭐','💰','🛒','🛍️','📦','🚚','💨','⏰','📍','📞','💬','😴','🤗','😇','🥰','😋','🤤'];
const PRODUCTS = [
  {name:'Kaos Hitam Premium', price:129000, grad:'from-slate-700 to-slate-900'},
  {name:'Brownies Kukus 20x20', price:85000, grad:'from-amber-600 to-amber-800'},
  {name:'Dress Bunga Sage', price:189000, grad:'from-emerald-500 to-teal-700'},
];
function ChatWindow({db, convId, onBack, onShowInfo, draft, setDraft, pushToast}){
  const conv = db.conversations.find(c=>c.id===convId);
  const [showEmoji,setShowEmoji]=useState(false);
  const [showAttach,setShowAttach]=useState(false);
  const [showAssign,setShowAssign]=useState(false);
  const [attachPreview,setAttachPreview]=useState(null);
  const fileRef=useRef(null);
  const bottomRef=useRef(null);
  const inputRef=useRef(null);
  const msgs = conv?convMessages(db,conv.id):[];
  const cust = conv?getCustomer(db,conv.customerId):null;
  const p = conv?PLATFORMS[conv.platform]:null;

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs.length, convId]);
  useEffect(()=>{ if(conv && conv.unread>0) markRead(conv.id); },[convId, conv?.unread]);

  if(!conv) return <div className="hidden md:flex flex-1 flex-col items-center justify-center bg-slate-50 dark:bg-slate-950/50 text-center p-8">
    <div className="w-24 h-24 rounded-3xl bg-gradient-to-br from-brand-500 to-violet-600 flex items-center justify-center mb-5 shadow-soft">
      <LucideIcon name="messages-square" size={44} className="text-white"/>
    </div>
    <h3 className="font-extrabold text-xl mb-2">Pilih percakapan untuk mulai membalas</h3>
    <p className="text-sm text-slate-400 max-w-xs">Semua chat dari WhatsApp, Instagram, Shopee & Tokopedia numpuk rapi di sini.</p>
  </div>;

  const doSend = ()=>{
    if(!draft.trim() && !attachPreview) return;
    sendAdminMessage(conv.id, draft, attachPreview);
    setDraft(''); setAttachPreview(null); setShowEmoji(false);
    pushToast('Pesan terkirim ✓✓','send');
  };
  const insertAtCursor = txt => {
    const el=inputRef.current;
    if(el){ const s=el.selectionStart??draft.length, e=el.selectionEnd??draft.length;
      setDraft(draft.slice(0,s)+txt+draft.slice(e));
      setTimeout(()=>{el.focus(); el.setSelectionRange(s+txt.length, s+txt.length);},0);
    } else setDraft(draft+txt);
  };
  const onFile = e=>{
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ setAttachPreview({type:'image', src:r.result, name:f.name}); setShowAttach(false); };
    r.readAsDataURL(f);
  };
  const quickReplies = db.quick_replies.slice(0,4);
  const assignedMember = db.team_members.find(t=>t.id===conv.assignedTo);

  return <div className="flex flex-col h-full bg-slate-50 dark:bg-slate-950/60 min-w-0">
    {/* HEADER */}
    <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 py-2.5 flex items-center gap-3 shrink-0">
      <button onClick={onBack} className="md:hidden w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center"><LucideIcon name="chevron-left" size={20}/></button>
      <div className="relative"><Avatar name={cust?.name} id={cust?.id}/><span className="absolute -bottom-0.5 -right-0.5"><PlatformDot platform={conv.platform} size={20}/></span></div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2">
          <h3 className="font-extrabold truncate">{esc(cust?.name)}</h3>
          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${p.chipBg}`}>{p.name}</span>
        </div>
        <p className="text-xs text-slate-400 truncate">
          {cust?.phone && cust.phone!=='-' ? cust.phone+' • ' : ''}{cust?.followers ? cust.followers+' followers • ' : ''}{conv.platform==='wa'?'Online':'Aktif baru-baru ini'}
        </p>
      </div>
      <div className="hidden sm:flex items-center gap-1.5">
        {conv.status!=='done'
          ? <button onClick={()=>{setConvStatus(conv.id,'done'); pushToast('Percakapan ditandai selesai','check-circle-2');}} className="flex items-center gap-1 text-xs font-bold bg-green-100 dark:bg-green-950 text-green-700 dark:text-green-300 hover:bg-green-200 px-3 py-2 rounded-full transition"><LucideIcon name="check-check" size={14}/> Selesai</button>
          : <button onClick={()=>setConvStatus(conv.id,'open')} className="flex items-center gap-1 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-2 rounded-full"><LucideIcon name="rotate-ccw" size={14}/> Buka lagi</button>}
        <div className="relative">
          <button onClick={()=>setShowAssign(v=>!v)} className="flex items-center gap-1 text-xs font-bold bg-violet-100 dark:bg-violet-950 text-violet-700 dark:text-violet-300 hover:bg-violet-200 px-3 py-2 rounded-full transition">
            <LucideIcon name="user-plus" size={14}/> {assignedMember?assignedMember.name:'Assign'}
          </button>
          {showAssign && <div className="absolute right-0 top-11 z-30 bg-white dark:bg-slate-800 rounded-xl shadow-pop border border-slate-200 dark:border-slate-700 p-1.5 w-48">
            <p className="text-[11px] font-bold text-slate-400 px-2 py-1">Assign ke:</p>
            {db.team_members.map(t=><button key={t.id} onClick={()=>{assignConversation(conv.id,t.id); setShowAssign(false); pushToast(`Chat di-assign ke ${t.name}`,'user-check');}}
              className="w-full flex items-center gap-2 px-2 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-sm">
              <Avatar name={t.name} id={t.id} size="w-7 h-7" text="text-[10px]"/>
              <span className="font-semibold">{t.name}</span><span className="text-[11px] text-slate-400">{t.role}</span>
              {conv.assignedTo===t.id && <LucideIcon name="check" size={14} className="ml-auto text-green-500"/>}
            </button>)}
            {conv.assignedTo && <button onClick={()=>{assignConversation(conv.id,null); setShowAssign(false);}} className="w-full text-left px-2 py-2 text-xs font-bold text-slate-400 hover:text-red-500">Hapus assign</button>}
          </div>}
        </div>
      </div>
      <button onClick={onShowInfo} className="md:hidden w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center"><LucideIcon name="info" size={18}/></button>
    </div>

    {/* MESSAGES */}
    <div className="flex-1 overflow-y-auto px-4 py-4 space-y-2.5" onClick={()=>{setShowEmoji(false); setShowAttach(false);}}>
      {msgs.map(m=>{
        const mine=m.from==='admin';
        return <div key={m.id} className={`flex ${mine?'justify-end':'justify-start'} anim-msg`}>
          <div className={`max-w-[78%] px-3.5 py-2.5 rounded-2xl text-[14px] leading-relaxed shadow-sm border ${mine?`${p.adminBubble} rounded-tr-md`:'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-tl-md'}`}>
            {m.attachment?.type==='image' && <img src={m.attachment.src} alt="lampiran" className="rounded-xl max-h-48 mb-1.5 cursor-pointer" onClick={e=>{e.stopPropagation(); window.open(m.attachment.src,'_blank');}}/>}
            {m.attachment?.type==='product' && <div className="flex items-center gap-2.5 bg-white dark:bg-slate-900 rounded-xl p-2 mb-1.5 border border-slate-200 dark:border-slate-700">
              <div className={`w-11 h-11 rounded-lg bg-gradient-to-br ${m.attachment.grad} flex items-center justify-center shrink-0`}><LucideIcon name="shopping-bag" size={20} className="text-white"/></div>
              <div><div className="text-xs font-bold">{m.attachment.name}</div><div className="text-xs font-extrabold text-brand-600">{rupiah(m.attachment.price)}</div></div>
            </div>}
            {m.text && <p className="whitespace-pre-wrap break-words">{esc(m.text)}</p>}
            <div className={`flex items-center justify-end gap-1 mt-1 text-[10px] ${mine?'text-slate-500':'text-slate-400'}`}>
              {clockTime(m.at)}{mine && <LucideIcon name="check-check" size={13} className="text-sky-500"/>}
            </div>
          </div>
        </div>;
      })}
      <div ref={bottomRef}/>
    </div>

    {/* QUICK REPLY BAR */}
    <div className="px-3 pt-1 shrink-0">
      <div className="flex gap-1.5 overflow-x-auto pb-1.5">
        {quickReplies.map(q=><button key={q.id} onClick={()=>insertAtCursor(q.text)} title={q.text}
          className="whitespace-nowrap text-xs font-bold text-brand-700 dark:text-brand-300 bg-brand-50 dark:bg-brand-900/40 hover:bg-brand-100 dark:hover:bg-brand-900/70 border border-brand-200 dark:border-brand-800 px-3 py-1.5 rounded-full transition">
          {q.shortcut}</button>)}
      </div>
    </div>

    {/* INPUT */}
    <div className="p-3 pt-1 shrink-0 relative">
      {attachPreview && <div className="mb-2 relative inline-block">
        <img src={attachPreview.src} className="h-20 rounded-xl border border-slate-200 dark:border-slate-700" alt="preview"/>
        <button onClick={()=>setAttachPreview(null)} className="absolute -top-2 -right-2 w-6 h-6 bg-slate-900 text-white rounded-full flex items-center justify-center"><LucideIcon name="x" size={13}/></button>
      </div>}
      {showEmoji && <div className="absolute bottom-[72px] left-3 z-30 bg-white dark:bg-slate-800 rounded-2xl shadow-pop border border-slate-200 dark:border-slate-700 p-3 w-[280px]">
        <div className="grid grid-cols-8 gap-1">{EMOJIS.map(e=><button key={e} onClick={()=>insertAtCursor(e)} className="text-xl hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg p-1 transition">{e}</button>)}</div>
      </div>}
      {showAttach && <div className="absolute bottom-[72px] left-3 z-30 bg-white dark:bg-slate-800 rounded-2xl shadow-pop border border-slate-200 dark:border-slate-700 p-2 w-64">
        <button onClick={()=>{fileRef.current?.click();}} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-semibold"><LucideIcon name="image" size={18} className="text-violet-500"/> Upload Foto</button>
        <div className="border-t border-slate-100 dark:border-slate-700 my-1"/>
        <p className="text-[11px] font-bold text-slate-400 px-3 py-1">Kirim info produk:</p>
        {PRODUCTS.map(pr=><button key={pr.name} onClick={()=>{sendAdminMessage(conv.id,'', {type:'product',...pr}); setShowAttach(false); pushToast('Info produk terkirim','shopping-bag');}}
          className="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
          <div className={`w-9 h-9 rounded-lg bg-gradient-to-br ${pr.grad} flex items-center justify-center shrink-0`}><LucideIcon name="shopping-bag" size={16} className="text-white"/></div>
          <div className="text-left"><div className="text-xs font-bold">{pr.name}</div><div className="text-[11px] font-extrabold text-brand-600">{rupiah(pr.price)}</div></div>
        </button>)}
      </div>}
      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onFile}/>
      <div className="flex items-end gap-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl p-1.5 shadow-sm">
        <button onClick={()=>{setShowAttach(v=>!v); setShowEmoji(false);}} className="w-10 h-10 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500" title="Attach foto/produk"><LucideIcon name="paperclip" size={19}/></button>
        <button onClick={()=>{setShowEmoji(v=>!v); setShowAttach(false);}} className="w-10 h-10 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500" title="Emoji"><LucideIcon name="smile" size={19}/></button>
        <textarea ref={inputRef} value={draft} onChange={e=>setDraft(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); doSend();} }}
          placeholder={`Balas ${cust?.name?.split(' ')[0]||'pelanggan'}...`} rows={1}
          className="flex-1 bg-transparent px-2 py-2.5 text-sm resize-none max-h-28 placeholder:text-slate-400"/>
        <button onClick={doSend} disabled={!draft.trim()&&!attachPreview} className="w-10 h-10 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center transition" title="Kirim">
          <LucideIcon name="send" size={18}/>
        </button>
      </div>
    </div>
  </div>;
}

            {cust.notes ? esc(cust.notes) : <span className="italic text-slate-400">+ Tambah catatan tentang pelanggan ini...</span>}

    <div className="border-t border-slate-200 dark:border-slate-800"/>

    {/* AI ASSISTANT */}
    <div>
      <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1.5">
        <LucideIcon name="sparkles" size={14} className="text-violet-500"/> AI Assistant
        <span className="ml-auto text-[10px] bg-violet-100 dark:bg-violet-950 text-violet-700 dark:text-violet-300 font-bold px-2 py-0.5 rounded-full">BETA</span>

        : <><LucideIcon name="wand-2" size={17}/> Bantu Jawab dengan AI</>}

      <p className="text-[11px] text-slate-400 mt-1.5 text-center">AI membaca 5 pesan terakhir, lalu buatkan 3 opsi jawaban</p>

      {aiOpts && <div className="space-y-2.5 mt-3">
        {aiOpts.map((o,i)=>
          <div key={i} className="anim-msg border border-violet-200 dark:border-violet-900 bg-violet-50/60 dark:bg-violet-950/30 rounded-2xl p-3">

              <button onClick={()=>pickOpt(o)} className="text-[11px] font-bold text-white bg-violet-600 hover:bg-violet-700 px-2.5 py-1 rounded-full transition flex items-center gap-1"><LucideIcon name="arrow-down-to-line" size={12}/> Pakai</button>
            </div>
            <p className="text-[13px] leading-relaxed text-slate-700 dark:text-slate-200">{o.text}</p>
          </div>)}
        <button onClick={runAI} className="w-full text-xs font-bold text-violet-600 hover:text-violet-700 py-1.5 flex items-center justify-center gap-1"><LucideIcon name="refresh-cw" size={13}/> Generate ulang</button>
      </div>}
    </div>
  </div>;
}

const CHANNEL_META = {
  wa:{name:'WhatsApp Business', desc:'Hubungkan via WhatsApp Business API / Cloud API', icon:'message-circle', color:'#25D366'},
  ig:{name:'Instagram', desc:'Hubungkan akun bisnis IG untuk DM otomatis', icon:'instagram', color:'#E1306C'},
  shopee:{name:'Shopee', desc:'Hubungkan via Shopee Open Platform', icon:'shopping-bag', color:'#EE4D2D'},
  tokopedia:{name:'Tokopedia', desc:'Hubungkan via Tokopedia Seller API', icon:'store', color:'#03AC0E'},
};
function SettingsPage({db, onBack, pushToast}){
  const [tab,setTab]=useState('channel');
  const [connKey,setConnKey]=useState(null);
  const [token,setToken]=useState('');
  const [connecting,setConnecting]=useState(false);
  const [qrForm,setQrForm]=useState(null);   // {id?} quick reply form
  const [qrTitle,setQrTitle]=useState(''); const [qrText,setQrText]=useState('');
  const [tmForm,setTmForm]=useState(false);
  const [tmName,setTmName]=useState(''); const [tmRole,setTmRole]=useState('CS Pagi');

  const connect=(key)=>{
    setConnecting(true);
    setTimeout(()=>{
      store.update(d=>({...d, channels:{...d.channels, [key]:{connected:true, token:token||'dummy-token-'+uid().slice(0,6)}}}));
      setConnecting(false); setConnKey(null); setToken('');
      pushToast(`${CHANNEL_META[key].name} terhubung (simulasi)`,'plug');
    },1200);
  };
  const disconnect=(key)=>{
    store.update(d=>({...d, channels:{...d.channels, [key]:{connected:false, token:''}}}));
    pushToast(`${CHANNEL_META[key].name} diputus`,'unplug');
  };
  const saveQR=()=>{
    if(!qrTitle.trim()||!qrText.trim()){ pushToast('Judul & isi balasan wajib diisi','alert-triangle'); return; }
    const shortcut='/'+qrTitle.toLowerCase().replace(/[^a-z0-9]+/g,'');
    if(qrForm?.id){
      store.update(d=>({...d, quick_replies:d.quick_replies.map(q=>q.id===qrForm.id?{...q,title:qrTitle,text:qrText}:q)}));
      pushToast('Template diperbarui','check');
    } else {
      store.update(d=>({...d, quick_replies:[...d.quick_replies,{id:uid(),shortcut,title:qrTitle,text:qrText}]}));
      pushToast(`Template ${shortcut} ditambahkan`,'check');
    }
    setQrForm(null); setQrTitle(''); setQrText('');
  };
  const addMember=()=>{
    if(!tmName.trim()){ pushToast('Nama wajib diisi','alert-triangle'); return; }
    store.update(d=>({...d, team_members:[...d.team_members,{id:uid(),name:tmName.trim(),role:tmRole,shift:'-',online:false}]}));
    setTmForm(false); setTmName(''); pushToast(`${tmName} ditambahkan ke tim`,'user-plus');
  };
  const resetDemo=()=>{
    if(confirm('Reset semua data ke demo awal? Chat simulasi akan hilang.')){
      localStorage.removeItem(DB_KEY);
      const db=seedDB(); persist(db); store.db=db; _subs.forEach(f=>f());
      pushToast('Data demo di-reset','refresh-cw');
    }
  };

  return <div className="min-h-screen bg-slate-50 dark:bg-slate-950">
    <div className="max-w-4xl mx-auto px-4 py-6">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack} className="w-10 h-10 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:shadow-soft"><LucideIcon name="arrow-left" size={18}/></button>
        <div><h1 className="font-extrabold text-xl">Pengaturan</h1><p className="text-sm text-slate-400">Kelola channel, balasan cepat & tim</p></div>
      </div>
      <div className="flex gap-2 mb-6">
        {[['channel','plug','Hubungkan Channel'],['qr','zap','Balasan Cepat'],['team','users','Kelola Tim']].map(t=>
          <button key={t[0]} onClick={()=>setTab(t[0])} className={`flex items-center gap-1.5 text-sm font-bold px-4 py-2.5 rounded-full transition ${tab===t[0]?'bg-slate-900 dark:bg-white text-white dark:text-slate-900':'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-500'}`}>
            <LucideIcon name={t[1]} size={15}/> {t[2]}</button>)}
      </div>

      {tab==='channel' && <div className="grid md:grid-cols-2 gap-4">
        {Object.keys(CHANNEL_META).map(key=>{
          const m=CHANNEL_META[key], ch=db.channels[key];
          return <div key={key} className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
            <div className="flex items-start justify-between mb-3">
              <div className="w-12 h-12 rounded-xl flex items-center justify-center text-white" style={{background:m.color}}><LucideIcon name={m.icon} size={24}/></div>
              {ch.connected
                ? <span className="flex items-center gap-1 text-xs font-bold text-green-700 bg-green-100 dark:bg-green-950 px-2.5 py-1 rounded-full"><span className="w-2 h-2 bg-green-500 rounded-full anim-pulse-dot"/> Terhubung</span>
                : <span className="text-xs font-bold text-slate-400 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-full">Belum terhubung</span>}
            </div>
            <h3 className="font-extrabold mb-1">{m.name}</h3>
            <p className="text-sm text-slate-400 mb-4">{m.desc}</p>
            {ch.connected
              ? <button onClick={()=>disconnect(key)} className="text-sm font-bold text-red-500 hover:text-red-600 border border-red-200 dark:border-red-900 px-4 py-2 rounded-full w-full transition">Putuskan Koneksi</button>
              : <button onClick={()=>setConnKey(key)} className="text-sm font-bold text-white px-4 py-2.5 rounded-full w-full transition" style={{background:m.color}}>Hubungkan</button>}
          </div>;
        })}
        <div className="md:col-span-2 bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900 rounded-2xl p-4 text-sm text-blue-800 dark:text-blue-200 flex gap-2">
          <LucideIcon name="info" size={18} className="shrink-0 mt-0.5"/>
          <span>Mode demo: koneksi disimulasikan dengan token dummy. Untuk production, ganti dengan OAuth resmi tiap platform (lihat PANDUAN).</span>
        </div>
      </div>}

      {tab==='qr' && <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-extrabold">Template Balasan Cepat</h3>
          <button onClick={()=>{setQrForm({}); setQrTitle(''); setQrText('');}} className="flex items-center gap-1 text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 px-4 py-2 rounded-full"><LucideIcon name="plus" size={15}/> Tambah</button>
        </div>
        <div className="space-y-2">
          {db.quick_replies.map(q=><div key={q.id} className="flex items-start gap-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl p-3">
            <span className="text-xs font-extrabold text-brand-700 dark:text-brand-300 bg-brand-100 dark:bg-brand-900/50 px-2 py-1 rounded-lg shrink-0">{q.shortcut}</span>
            <div className="flex-1 min-w-0"><div className="font-bold text-sm">{q.title}</div><div className="text-xs text-slate-400 truncate">{q.text}</div></div>
            <button onClick={()=>{setQrForm(q); setQrTitle(q.title); setQrText(q.text);}} className="p-1.5 text-slate-400 hover:text-brand-600"><LucideIcon name="pencil" size={15}/></button>
            <button onClick={()=>{store.update(d=>({...d,quick_replies:d.quick_replies.filter(x=>x.id!==q.id)})); pushToast('Template dihapus','trash-2');}} className="p-1.5 text-slate-400 hover:text-red-500"><LucideIcon name="trash-2" size={15}/></button>
          </div>)}
        </div>
      </div>}

      {tab==='team' && <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-extrabold">Tim Customer Service</h3>
          <button onClick={()=>setTmForm(v=>!v)} className="flex items-center gap-1 text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 px-4 py-2 rounded-full"><LucideIcon name="plus" size={15}/> Tambah Admin</button>
        </div>
        {tmForm && <div className="flex flex-col sm:flex-row gap-2 mb-4 bg-slate-50 dark:bg-slate-800/60 rounded-xl p-3">
          <input value={tmName} onChange={e=>setTmName(e.target.value)} placeholder="Nama admin..." className="flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm"/>
          <select value={tmRole} onChange={e=>setTmRole(e.target.value)} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-semibold">
            <option>CS Pagi</option><option>CS Sore</option><option>Admin</option><option>Owner</option>
          </select>
          <button onClick={addMember} className="bg-brand-600 text-white text-sm font-bold px-5 py-2 rounded-xl">Simpan</button>
        </div>}
        <div className="space-y-2">
          {db.team_members.map(t=><div key={t.id} className="flex items-center gap-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl p-3">
            <div className="relative"><Avatar name={t.name} id={t.id}/>{t.online && <span className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-slate-900 rounded-full"/>}</div>
            <div className="flex-1"><div className="font-bold text-sm flex items-center gap-2">{t.name}{t.role==='Owner'&&<span className="text-[10px] font-bold bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded">Kamu</span>}</div>
              <div className="text-xs text-slate-400">{t.role} • {t.shift}</div></div>
            {t.role!=='Owner' && <button onClick={()=>{store.update(d=>({...d,team_members:d.team_members.filter(x=>x.id!==t.id), conversations:d.conversations.map(c=>c.assignedTo===t.id?{...c,assignedTo:null}:c)})); pushToast(`${t.name} dihapus dari tim`,'user-x');}} className="p-1.5 text-slate-400 hover:text-red-500"><LucideIcon name="trash-2" size={15}/></button>}
          </div>)}
        </div>
      </div>}

      <div className="mt-6 flex flex-wrap gap-2">
        <button onClick={resetDemo} className="text-sm font-bold text-slate-500 hover:text-red-500 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-full transition flex items-center gap-1.5"><LucideIcon name="refresh-cw" size={14}/> Reset Data Demo</button>
      </div>
    </div>

    {/* MODAL KONEKSI */}
    {connKey && <div className="fixed inset-0 z-[90] bg-black/50 flex items-center justify-center p-4" onClick={()=>setConnKey(null)}>
      <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 w-full max-w-sm shadow-pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-4">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white" style={{background:CHANNEL_META[connKey].color}}><LucideIcon name={CHANNEL_META[connKey].icon} size={22}/></div>
          <div><h3 className="font-extrabold">Hubungkan {CHANNEL_META[connKey].name}</h3><p className="text-xs text-slate-400">Simulasi koneksi API</p></div>
        </div>
        <label className="text-xs font-bold text-slate-500">API TOKEN (dummy)</label>
        <input value={token} onChange={e=>setToken(e.target.value)} placeholder="cth: wa_token_abc123..." className="w-full mt-1 mb-4 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm font-mono"/>
        <div className="flex gap-2">
          <button onClick={()=>setConnKey(null)} className="flex-1 text-sm font-bold border border-slate-200 dark:border-slate-700 py-2.5 rounded-xl">Batal</button>
          <button onClick={()=>connect(connKey)} disabled={connecting} className="flex-1 text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 disabled:opacity-60 py-2.5 rounded-xl flex items-center justify-center gap-2">
            {connecting ? <><LucideIcon name="loader-2" size={15} className="animate-spin"/> Menghubungkan...</> : 'Simulasikan Koneksi'}
          </button>
        </div>
      </div>
    </div>}

    {/* MODAL QUICK REPLY */}
    {qrForm && <div className="fixed inset-0 z-[90] bg-black/50 flex items-center justify-center p-4" onClick={()=>setQrForm(null)}>
      <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 w-full max-w-md shadow-pop" onClick={e=>e.stopPropagation()}>
        <h3 className="font-extrabold mb-4">{qrForm.id?'Edit Template':'Tambah Template Baru'}</h3>
        <label className="text-xs font-bold text-slate-500">Judul (shortcut otomatis: /judul)</label>
        <input value={qrTitle} onChange={e=>setQrTitle(e.target.value)} placeholder="cth: Jam Operasional" className="w-full mt-1 mb-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm"/>
        <label className="text-xs font-bold text-slate-500">Isi Balasan</label>
        <textarea value={qrText} onChange={e=>setQrText(e.target.value)} rows={4} placeholder="Tulis template balasan..." className="w-full mt-1 mb-4 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm"/>
        <div className="flex gap-2">
          <button onClick={()=>setQrForm(null)} className="flex-1 text-sm font-bold border border-slate-200 dark:border-slate-700 py-2.5 rounded-xl">Batal</button>
          <button onClick={saveQR} className="flex-1 text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 py-2.5 rounded-xl">Simpan Template</button>
        </div>
      </div>
    </div>}
  </div>;
}

/* ================= APP SHELL ================= */
function App(){
  const db = useStore();
  const [view,setView]=useState('landing');       // landing | app | settings
  const [activeId,setActiveId]=useState(null);
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');
  const [draft,setDraft]=useState('');
  const [mobileTab,setMobileTab]=useState('list'); // list | chat | info (mobile)
  const [flashId,setFlashId]=useState(null);
  const {toasts,push}=useToasts();
  const convIdRef=useRef(null); convIdRef.current=activeId;

  // theme
  useEffect(()=>{
    const t=db.theme||'light';
    document.documentElement.classList.toggle('dark', t==='dark');
  },[db.theme]);
  const toggleTheme=()=>store.update(d=>({...d, theme:d.theme==='dark'?'light':'dark'}));

  // FASE 2.1 — simulasi chat masuk tiap 15 detik saat di inbox
  useEffect(()=>{
    if(view!=='app') return;
    const iv=setInterval(()=>{
      const fid=simulateIncomingChat();
      if(!fid) return;
      setFlashId(fid);
      setTimeout(()=>setFlashId(f=>f===fid?null:f), 3500);
      const c=store.db.conversations.find(x=>x.id===fid);
      const cust=c?getCustomer(store.db,c.customerId):null;
      push(`Chat baru dari ${cust?.name||'pelanggan'} (${PLATFORMS[c?.platform]?.name})`,'message-circle');
    },15000);
    return ()=>clearInterval(iv);
  },[view]);

  const goApp=()=>{ setView('app'); setMobileTab('list'); };
  const selectConv=id=>{ setActiveId(id); setDraft(''); setMobileTab('chat'); };
  const newDummy=()=>{ const fid=simulateIncomingChat(); if(!fid){ push('Semua chat sudah selesai 🎉','check-circle-2'); return; } setFlashId(fid); setTimeout(()=>setFlashId(f=>f===fid?null:f),3500); push('Chat dummy dibuat untuk demo','zap'); };

  if(view==='landing') return <><LandingPage goApp={goApp} theme={db.theme} toggleTheme={toggleTheme}/><Toasts toasts={toasts}/></>;
  if(view==='settings') return <><SettingsPage db={db} onBack={goApp} pushToast={push}/><Toasts toasts={toasts}/></>;

  const sound=db.sound!==false;
  return <div className="h-screen flex flex-col overflow-hidden">
    {/* TOP BAR */}
    <header className="shrink-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 py-2 flex items-center gap-2 z-20">
      <button onClick={()=>setView('landing')} className="flex items-center gap-2 shrink-0" title="Kembali ke landing page">
        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-violet-600 flex items-center justify-center text-white font-extrabold text-sm">B</div>
        <span className="font-extrabold hidden sm:inline">BalasCepat</span>
      </button>
      <div className="flex-1"/>
      <button onClick={newDummy} className="flex items-center gap-1.5 text-xs font-bold text-white bg-gradient-to-r from-violet-600 to-brand-600 hover:opacity-90 px-3.5 py-2 rounded-full transition shadow-soft">
        <LucideIcon name="zap" size={14}/> <span className="hidden sm:inline">Buat Chat Dummy Baru</span><span className="sm:hidden">Dummy</span>
      </button>
      <button onClick={()=>store.update(d=>({...d,sound:!d.sound}))} title={sound?'Matikan suara notifikasi':'Nyalakan suara notifikasi'}
        className="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500">
        <LucideIcon name={sound?'bell-ring':'bell-off'} size={18}/>
      </button>
      <button onClick={toggleTheme} title="Dark mode" className="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500">
        <LucideIcon name={db.theme==='dark'?'sun':'moon'} size={18}/>
      </button>
      <button onClick={()=>setView('settings')} title="Pengaturan" className="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500">
        <LucideIcon name="settings" size={18}/>
      </button>
    </header>

    {/* 3 KOLOM */}
    <div className="flex-1 flex min-h-0">
      {/* Kolom 1 — 20% */}
      <div className={`w-full md:w-[26%] lg:w-[22%] shrink-0 h-full ${mobileTab!=='list'?'hidden md:block':''}`}>
        <InboxList db={db} activeId={activeId} onSelect={selectConv} filter={filter} setFilter={setFilter}
          search={search} setSearch={setSearch} onNewDummy={newDummy} flashId={flashId}/>
      </div>
      {/* Kolom 2 — 55% */}
      <div className={`flex-1 min-w-0 h-full ${mobileTab!=='chat'?'hidden md:flex':''} flex-col`} style={{display: mobileTab!=='chat' ? undefined : 'flex'}}>
        <div className={`h-full ${mobileTab==='chat'?'flex':'hidden'} md:flex flex-col w-full`}>
          <ChatWindow db={db} convId={activeId} onBack={()=>setMobileTab('list')} onShowInfo={()=>setMobileTab('info')}
            draft={draft} setDraft={setDraft} pushToast={push}/>
        </div>
      </div>
      {/* Kolom 3 — 25% */}
      <div className={`w-full md:w-[30%] lg:w-[26%] shrink-0 h-full ${mobileTab!=='info'?'hidden md:block':''}`}>
        <div className="md:hidden flex items-center gap-2 p-2 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
          <button onClick={()=>setMobileTab('chat')} className="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center"><LucideIcon name="chevron-left" size={20}/></button>
          <span className="font-extrabold text-sm">Info & AI Assistant</span>
        </div>
        <InfoPanel db={db} convId={activeId} onInsertDraft={t=>{setDraft(t); setMobileTab('chat');}} pushToast={push}/>
      </div>
    </div>

    {/* MOBILE BOTTOM NAV */}
    <nav className="md:hidden shrink-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex z-20">
      {[['list','inbox','Chat'],['chat','message-square','Balas'],['info','sparkles','Info & AI']].map(t=>
        <button key={t[0]} onClick={()=>setMobileTab(t[0])} className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 text-[11px] font-bold ${mobileTab===t[0]?'text-brand-600':'text-slate-400'}`}>
          <LucideIcon name={t[1]} size={20}/>{t[2]}
        </button>)}
    </nav>
    <Toasts toasts={toasts}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
